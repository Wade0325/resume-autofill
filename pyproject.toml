[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-autofill"
version = "0.1.0"
description = "本地端、開源、AI 輔助的 Word 履歷表自動填寫工具"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",   # UploadFile 的必要依賴，缺了會在上傳當下才報錯
    "python-docx>=1.1",
    "requests>=2.31",
    "pypdfium2>=4.30",           # 視覺模式：把 PDF 頁面畫成截圖
    "pillow>=10",                # pypdfium2 輸出點陣圖轉 PNG
]

[project.optional-dependencies]
# 開發用的追蹤。設了 LANGFUSE_* 環境變數才會啟用，打包版不含它
# 自架的 Langfuse 是 v3 架構，SDK 要跟著留在 v3
dev = ["langfuse>=3,<4"]
# 測試。瀏覽器那一組還要 playwright 與已經 build 好的 frontend/dist，
# 缺任何一樣就自動跳過（見 tests/browser/conftest.py）
# httpx2 不是打錯：starlette 的 TestClient 已經改用它，裝舊的 httpx 會一直跳棄用警告
test = ["pytest>=8", "httpx2", "playwright>=1.49"]
# lint 的版本釘死：ruff 每個小版本都可能多出新規則，浮動版本會讓 CI 無預警變紅，
# 而且本機與 CI 跑的不是同一套規則就失去意義
lint = ["ruff==0.9.6"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
# 現有程式碼本來就抓 100：只有 20 幾行超出，收齊比放寬合理
line-length = 100
extend-exclude = ["claude_code_in_agent"]   # 研究迴圈不入版控，也不歸這裡管

[tool.ruff.lint]
# 刻意不開 UP 與 B：UP006/UP007 會要求把 Dict/Optional 全面換成 dict/|，
# 那是 600 多處的風格遷移，跟「把 lint 釘下來」是兩件事，要做也該單獨做。
# E/W＝pycodestyle，F＝pyflakes（真正的錯誤），I＝import 排序（差異才穩定）
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 預設只跑不需要瀏覽器的那些。要跑瀏覽器：pytest -m browser（或 -m ""跑全部）
addopts = "-m 'not browser' --strict-markers"
markers = [
    "browser: 需要 playwright、chromium 與 build 好的 frontend/dist",
]
filterwarnings = [
    # starlette 的 TestClient 用到 anyio 的舊別名，不是我們能修的
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
