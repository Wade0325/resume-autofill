[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-autofill"
version = "0.1.0"
description = "本地端、開源、AI 輔助的 Word 履歷表自動填寫工具"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",   # UploadFile 的必要依賴，缺了會在上傳當下才報錯
    "python-docx>=1.1",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["backend*"]
